name: Trigger ShadowRocket Rules Update

    on:
      push:
        paths:
          - 'cfg/Custom_Clash.ini'
          - 'rule/**'
        branches:
          - main
      workflow_dispatch:

    jobs:
      notify-shadowrocket:
        runs-on: ubuntu-latest
        steps:
          - name: Send dispatch event to ShadowRocket-rules
            run: |
              curl -L \
                -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${{ secrets.SHADOWROCKET_DISPATCH_TOKEN }}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/mrc991/ShadowRocket-rules/dispatches \
                -d '{"event_type":"openclash_updated"}'
