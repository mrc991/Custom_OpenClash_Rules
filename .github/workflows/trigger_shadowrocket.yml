name: Trigger ShadowRocket Rules Update

on:
  push:
    paths:
      - "cfg/Custom_Clash.ini"
      - "rule/**"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-shadowrocket:
    runs-on: ubuntu-latest
    steps:
      - name: Send dispatch event to ShadowRocket-rules
        env:
          TOKEN: ${{ secrets.SHADOWROCKET_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "SHADOWROCKET_DISPATCH_TOKEN is empty"
            exit 1
          fi
          code=$(curl -sS -o /tmp/gh-dispatch.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/mrc991/ShadowRocket-rules/dispatches \
            -d '{"event_type":"openclash_updated"}')
          echo "dispatch HTTP ${code}"
          if [ "${code}" != "204" ]; then
            cat /tmp/gh-dispatch.json
            exit 1
          fi
